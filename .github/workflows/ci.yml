name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 covers native type-stripping compatibility relied on by the framework source.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packs every package and checks a clean consumer at runtime and against its declarations.
      - run: npm run smoke:packages
      - run: npm run audit:consumers
      - run: git diff --check
